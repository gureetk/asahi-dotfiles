# ~/.config/fuzzel/fuzzel.ini  -  app launcher (Ctrl+D or Ctrl+Space)
# Every option: man 5 fuzzel.ini

[main]
font=sans-serif:size=12
prompt="❯ "
icon-theme=Adwaita
terminal=foot -e
layer=overlay
width=36
lines=10
horizontal-pad=18
vertical-pad=14
inner-pad=8

[colors]
background=16161ef2
text=e6e6efff
prompt=8a8ca0ff
input=e6e6efff
match=7aa2f7ff
selection=2a2c3aff
selection-text=ffffffff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=12
